<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uchkurgan Debates — Semifinal 1</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #1a2744;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .motion {
      background: #eef2f7;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .motion strong {
      display: block;
      margin-bottom: 6px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .team {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 10px;
    }

    .team h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .team-a {
      border-top: 5px solid #c9a24b;
    }

    .team-b {
      border-top: 5px solid #1a2744;
    }

    .criteria {
      display: grid;
      gap: 12px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    input.invalid {
      border: 2px solid #d9534f;
      background: #fff5f5;
    }

    .section-title {
      margin-top: 30px;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid #ddd;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #1a2744;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 25px;
    }

    button:hover {
      background: #0d1826;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f0f4f8;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .error {
      color: #d9534f;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .teams {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Uchkurgan International Debates</h1>
  <div class="subtitle">Semifinal 1 — Evaluation</div>

  <div class="motion">
    <strong>Motion:</strong>
    University education should be free for everyone.
  </div>

  <div class="teams">

    <div class="team team-a">
      <h2>The Third Triumvirate — SUPPORT</h2>

      <div class="criteria">

        <div>
          <label>Round 1 — Opening Statement /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Round 2 — Main Rebuttal /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Round 3 — Direct Response /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Round 4 — Cross-Questioning /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Round 5 — Final Statement /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Argumentation & Logic /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Research & Evidence /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Delivery & Communication /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Teamwork & Strategy /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Consistency & Relevance /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

      </div>
    </div>


    <div class="team team-b">
      <h2>Invictious — OPPOSE</h2>

      <div class="criteria">

        <div>
          <label>Round 1 — Opening Statement /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Round 2 — Main Rebuttal /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Round 3 — Direct Response /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Round 4 — Cross-Questioning /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Round 5 — Final Statement /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Argumentation & Logic /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Research & Evidence /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Delivery & Communication /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Teamwork & Strategy /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

        <div>
          <label>Consistency & Relevance /10</label>
          <input type="number" min="1" max="10" step="1" class="score">
        </div>

      </div>
    </div>

  </div>

  <button id="calculate">Calculate Result</button>

  <div id="error" class="error"></div>

  <div id="result" class="result" style="display:none;"></div>

</div>

<script>
const inputs = document.querySelectorAll(".score");
const calculateButton = document.getElementById("calculate");
const result = document.getElementById("result");
const error = document.getElementById("error");

inputs.forEach(input => {
  input.addEventListener("input", () => {
    const value = Number(input.value);

    if (
      input.value === "" ||
      !Number.isInteger(value) ||
      value < 1 ||
      value > 10
    ) {
      input.classList.add("invalid");
    } else {
      input.classList.remove("invalid");
    }
  });
});

calculateButton.addEventListener("click", () => {

  let valid = true;

  inputs.forEach(input => {
    const value = Number(input.value);

    if (
      input.value === "" ||
      !Number.isInteger(value) ||
      value < 1 ||
      value > 10
    ) {
      input.classList.add("invalid");
      valid = false;
    }
  });

  if (!valid) {
    error.textContent =
      "Please enter a whole number from 1 to 10 for every criterion.";
    result.style.display = "none";
    return;
  }

  error.textContent = "";

  let teamAScore = 0;
  let teamBScore = 0;

  for (let i = 0; i < 10; i++) {
    teamAScore += Number(inputs[i].value);
  }

  for (let i = 10; i < 20; i++) {
    teamBScore += Number(inputs[i].value);
  }

  let winner;

  if (teamAScore > teamBScore) {
    winner = "The Third Triumvirate";
  } else if (teamBScore > teamAScore) {
    winner = "Invictious";
  } else {
    winner = "Tie";
  }

  result.style.display = "block";

  result.innerHTML = `
    The Third Triumvirate: ${teamAScore}/100<br>
    Invictious: ${teamBScore}/100<br><br>
    Result: ${winner}
  `;
});
</script>

</body>
</html>
